name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["game/**", ".github/workflows/build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Find SDK paths
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}" >> $GITHUB_ENV
          echo "JAVA_HOME_DIR=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          ls "${ANDROID_HOME:-/opt/android-sdk}" || true
          ls "${ANDROID_HOME:-/opt/android-sdk}/build-tools" || true

      - name: Write Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.2.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cat ~/.config/godot/editor_settings-4.2.tres

      - name: Export APK
        working-directory: game
        run: |
          mkdir -p ../build
          godot --headless --import || true
          godot --headless --export-debug "Android" ../build/cheeno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cheeno-apk
          path: build/cheeno.apk
