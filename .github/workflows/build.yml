name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["game/**", ".github/workflows/build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Setup templates and Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.2.2.stable ~/.local/share/godot/export_templates/4.2.2.stable 2>/dev/null || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOT

      - name: Install custom build template and deep link
        working-directory: game
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/4.2.2.stable/android_source.zip -d android/build
          echo "4.2.2.stable" > android/.build_version
          sed -i '0,/<\/activity>/s##    <intent-filter>\n        <action android:name="android.intent.action.VIEW" />\n        <category android:name="android.intent.category.DEFAULT" />\n        <category android:name="android.intent.category.BROWSABLE" />\n        <data android:scheme="cheeno" android:host="auth" />\n    </intent-filter>\n    </activity>#' android/build/AndroidManifest.xml
          grep -n "cheeno" android/build/AndroidManifest.xml

      - name: Export APK
        working-directory: game
        run: |
          mkdir -p ../build
          godot --headless --import || true
          godot --headless --export-debug "Android" ../build/cheeno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cheeno-apk
          path: build/cheeno.apk
