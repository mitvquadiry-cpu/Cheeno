name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["game/**", ".github/workflows/build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot paths
        run: |
          JAVA_DIR=/usr/lib/jvm/java-17-openjdk-amd64
          SDK_DIR=/usr/lib/android-sdk
          KS=$HOME/.android/debug.keystore
          TPL_DIR=$(dirname "$(find / -name android_debug.apk -not -path '*/proc/*' 2>/dev/null | head -1)")
          mkdir -p $HOME/.local/share/godot/export_templates
          ln -sfn "$TPL_DIR" $HOME/.local/share/godot/export_templates/4.2.2.stable
          mkdir -p $HOME/.android
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KS" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p $HOME/.config/godot
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_DIR\"" \
            "export/android/android_sdk_path = \"$SDK_DIR\"" \
            "export/android/debug_keystore = \"$KS\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > $HOME/.config/godot/editor_settings-4.tres
          cat $HOME/.config/godot/editor_settings-4.tres

      - name: Install build tools
        run: |
          echo BEFORE; ls -la /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          echo AFTER; ls -la /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms
          ls /usr/lib/android-sdk/build-tools/33.0.2 | head -5

      - name: Diagnose
        run: |
          echo TEMPLATES; ls -laL $HOME/.local/share/godot/export_templates/4.2.2.stable | head -40
          echo PRESET; cat game/export_presets.cfg
          echo SDK; ls -la /usr/lib/android-sdk /usr/lib/android-sdk/cmdline-tools /usr/lib/android-sdk/platform-tools | head -60
          echo KEYS; keytool -list -keystore $HOME/.android/debug.keystore -storepass android || true
          echo JAVA; ls /usr/lib/jvm; ls /usr/lib/jvm/java-17-openjdk-amd64/bin | head -20

      - name: Export APK
        working-directory: game
        run: |
          mkdir -p ../build
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" ../build/cheeno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cheeno-apk
          path: build/cheeno.apk
