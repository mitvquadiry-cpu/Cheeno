name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["game/**", ".github/workflows/build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot paths
        run: |
          JAVA_DIR=/usr/lib/jvm/java-17-openjdk-amd64
          SDK_DIR=/usr/lib/android-sdk
          KS=$HOME/.android/debug.keystore
          TPL_DIR=$(dirname "$(find / -name android_debug.apk -not -path '*/proc/*' 2>/dev/null | head -1)")
          mkdir -p $HOME/.local/share/godot/export_templates
          ln -sfn "$TPL_DIR" $HOME/.local/share/godot/export_templates/4.2.2.stable
          mkdir -p $HOME/.android
          cp game/ci/debug.keystore "$KS"
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KS" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          mkdir -p $HOME/.config/godot
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_DIR\"" \
            "export/android/android_sdk_path = \"$SDK_DIR\"" \
            "export/android/debug_keystore = \"$KS\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > $HOME/.config/godot/editor_settings-4.tres
          cat $HOME/.config/godot/editor_settings-4.tres

      - name: Install build tools
        run: |
          echo BEFORE; ls -la /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          echo AFTER; ls -la /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms
          ls /usr/lib/android-sdk/build-tools/33.0.2 | head -5

      - name: Diagnose
        run: |
          echo TEMPLATES; ls -laL $HOME/.local/share/godot/export_templates/4.2.2.stable | head -40
          echo PRESET; cat game/export_presets.cfg
          echo SDK; ls -la /usr/lib/android-sdk /usr/lib/android-sdk/cmdline-tools /usr/lib/android-sdk/platform-tools | head -60
          echo KEYS; keytool -list -keystore $HOME/.android/debug.keystore -storepass android || true
          echo JAVA; ls /usr/lib/jvm; ls /usr/lib/jvm/java-17-openjdk-amd64/bin | head -20

      - name: Prepare Android custom build
        working-directory: game
        run: |
          SRC=$(find / -name android_source.zip -not -path '*/proc/*' 2>/dev/null | head -1)
          echo "source: $SRC"
          mkdir -p android/build
          echo "4.2.2.stable" > android/.build_version
          unzip -q -o "$SRC" -d android/build
          touch android/build/.gdignore
          sed -i 's#</activity>#<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="cheeno"/></intent-filter><intent-filter android:autoVerify="true"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="https" android:host="game.donitoo.ir" android:pathPrefix="/app-return"/></intent-filter></activity>#' android/build/AndroidManifest.xml
          grep -n -B2 -A2 cheeno android/build/AndroidManifest.xml

      - name: Build CheenoPicker plugin (.aar)
        working-directory: game
        run: |
          set -e
          GLIB=$(find android/build /usr/lib/android-sdk / -name 'godot-lib*.aar' -not -path '*/proc/*' 2>/dev/null | head -1)
          echo "godot lib: $GLIB"
          test -n "$GLIB"
          rm -rf /tmp/gl && mkdir -p /tmp/gl /tmp/cp/classes
          unzip -q -o "$GLIB" classes.jar -d /tmp/gl
          javac -source 17 -target 17 -encoding UTF-8 -Xlint:-options \
            -cp /tmp/gl/classes.jar:/usr/lib/android-sdk/platforms/android-33/android.jar \
            -d /tmp/cp/classes $(find android/plugin_src -name '*.java')
          (cd /tmp/cp/classes && jar cf /tmp/cp/classes.jar .)
          mkdir -p /tmp/aar && cp /tmp/cp/classes.jar /tmp/aar/classes.jar
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="ir.donitoo.cheeno.picker"/>' > /tmp/aar/AndroidManifest.xml
          (cd /tmp/aar && zip -q -r /tmp/CheenoPicker.aar classes.jar AndroidManifest.xml)
          cp /tmp/CheenoPicker.aar android/plugins/CheenoPicker.aar
          ls -l android/plugins

      - name: Add WebRTC plugin
        working-directory: game
        run: |
          (command -v unzip >/dev/null && command -v python3 >/dev/null) || (apt-get update -qq && apt-get install -y -qq unzip python3)
          python3 -c "import urllib.request as u,sys;u.urlretrieve(sys.argv[1],sys.argv[2])" https://github.com/godotengine/webrtc-native/releases/download/1.0.9-stable/godot-extension-webrtc.zip /tmp/webrtc.zip
          unzip -q -o /tmp/webrtc.zip -d /tmp/webrtc
          mkdir -p addons
          cp -r /tmp/webrtc/webrtc addons/ || cp -r /tmp/webrtc/* addons/
          find addons -maxdepth 3 | head -20

      - name: Export APK
        env:
          RELEASE_KS_B64: ${{ secrets.RELEASE_KS_B64 }}
          RELEASE_KS_PASS: ${{ secrets.RELEASE_KS_PASS }}
        working-directory: game
        run: |
          mkdir -p ../build
          godot --headless --import || true
          if [ -z "$RELEASE_KS_B64" ] || [ -z "$RELEASE_KS_PASS" ]; then
            echo "ERROR: secrets RELEASE_KS_B64 / RELEASE_KS_PASS are empty in this run. Refusing to build a debug APK."
            exit 1
          fi
          if [ -n "$RELEASE_KS_B64" ]; then
            echo "$RELEASE_KS_B64" | base64 -d > $HOME/release.p12
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.p12
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=cheeno
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_KS_PASS"
            godot --headless --verbose --export-release "Android" ../build/cheeno.apk
          fi
          ls -l ../build/cheeno.apk
          apksigner verify --print-certs ../build/cheeno.apk | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: cheeno-apk
          path: build/cheeno.apk
